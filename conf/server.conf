bind 127.0.0.1 192.168.1.98
port 6380

protected-mode yes

dir /home/dsicilia/.local/state/redist

# For an MVP cache/coordination server, you may not even need persistence:
save ""
appendonly no

# Allow basically all keyspace/keyevent pub/sub activity. This
# allows us to subscribe to changes related to keys.
notify-keyspace-events KEA

# Optional memory cap later:
# maxmemory 8gb
# maxmemory-policy allkeys-lru